services:
  backend:
    container_name: blackjack-backend-dev
    build: ./backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_modules:/app/node_modules
    environment:
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: npm run dev

  frontend:
    container_name: blackjack-frontend-dev
    build: ./frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
      - ./secrets/certs/blackjack.local.crt:/certs/cert.pem:ro
      - ./secrets/certs/blackjack.local.key:/certs/key.pem:ro
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host

  db:
    image: postgres:15-alpine
    container_name: blackjack-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

volumes:
  backend_modules:
  frontend_modules:
