# Redirigir HTTP a HTTPS
server {
    listen 80;
    server_name blackjack.com www.blackjack.com;
    
    return 301 https://blackjack.com$request_uri;
}

# Servir el sitio en HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name blackjack.com www.blackjack.com;
    
    # SSL - Certificados
    ssl_certificate /etc/ssl/certs/blackjack.com.crt;
    ssl_certificate_key /etc/ssl/private/blackjack.com.key;
    
    # Configuración SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    
    # Logs
    access_log /var/log/nginx/blackjack_access.log;
    error_log /var/log/nginx/blackjack_error.log;
    
    # WebSocket para Socket.IO - DEBE IR PRIMERO
    location /socket.io/ {
        proxy_pass http://backend:3000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts para WebSocket
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
    
    # Backend API
    location /api/ {
        proxy_pass http://backend:3000/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Frontend (React/Vite)
    location / {
        proxy_pass http://frontend:5173;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Denegar archivos peligrosos
    location ~ /\.(git|svn|htaccess|htpasswd|env) {
        deny all;
        access_log off;
        log_not_found off;
    }
}