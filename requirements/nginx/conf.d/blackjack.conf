# CHANGED FILE IN ORDER TO WORK ON PORT 5173 -MSORIANO

server {
    # Nginx moderno pide separar el http2
    listen 443 ssl;
    http2 on; 
    server_name blackjack.local www.blackjack.local;

    ssl_certificate /etc/ssl/certs/blackjack.local.crt;
    ssl_certificate_key /etc/ssl/private/blackjack.local.key;

    # Headers de seguridad...
    
    # Frontend (React/Vite en puerto 5173) - ESTE ES EL BUENO
    location / {
        proxy_pass http://blackjack-frontend:5173;
        
        # Estas líneas son súper importantes para el Hot Reload de Vite (HMR)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Backend API - (Lo hemos restaurado para que tu frontend pueda hablar con el backend)
    location /api/ {
        proxy_pass http://blackjack-backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets
    location /socket.io/ {
        proxy_pass http://blackjack-backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
