# ============================================================
# HTTP — Redirect all plain HTTP traffic to HTTPS
# Exposed to the internet: YES (port 80, public-facing)
# ============================================================
server {
    listen 80;
    server_name blackjack.local www.blackjack.local localhost;

    # Permanent redirect to HTTPS; preserves original URI
    return 301 https://$host$request_uri;
}


# ============================================================
# HTTPS — Main server block
# Exposed to the internet: YES (port 443, public-facing)
# ============================================================
server {
    listen 443 ssl;
    server_name blackjack.local www.blackjack.local localhost;

    # --- TLS configuration ---
    ssl_certificate     /etc/ssl/certs/blackjack.local.crt;
    ssl_certificate_key /etc/ssl/private/blackjack.local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;   # Disable older, insecure protocols
    ssl_ciphers         HIGH:!aNULL:!MD5;   # Strong ciphers only


    # --------------------------------------------------------
    # PUBLIC — Static frontend assets (served by Nginx itself)
    # Exposed to the internet: YES
    # Source: Vite build output
    # --------------------------------------------------------
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        # Serve file → directory → fallback to index.html (SPA routing)
        try_files $uri $uri/ /index.html;
    }


    # --------------------------------------------------------
    # INTERNAL ROUTING — Backend REST API
    # Exposed to the internet: NO (proxied to internal service)
    # Target: http://backend:3000  (Docker / internal network)
    # --------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade support (in case API endpoints use it)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward original request metadata to the backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # --------------------------------------------------------
    # INTERNAL ROUTING — Machine Learning microservice
    # Exposed to the internet: NO (proxied to internal service)
    # Target: http://ml-service:5000  (Docker / internal network)
    # Note: trailing slash on proxy_pass strips the /ml/ prefix
    # --------------------------------------------------------
    location /ml/ {
        proxy_pass         http://ml-service:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }


    # --------------------------------------------------------
    # INTERNAL ROUTING — WebSocket connections (Socket.IO)
    # Exposed to the internet: NO (proxied to internal service)
    # Target: http://backend:3000  (Docker / internal network)
    # Note: long timeouts keep persistent connections alive
    # --------------------------------------------------------
    location /socket.io/ {
        proxy_pass         http://backend:3000/socket.io/;
        proxy_http_version 1.1;

        # Required headers for the WebSocket handshake
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Forward original request metadata to the backend
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts to support long-lived WebSocket connections
        proxy_connect_timeout 7d;
        proxy_send_timeout    7d;
        proxy_read_timeout    7d;
    }
}
