services:
  # Builds the React frontend and outputs static files to the shared volume.
  # Runs once and exits — Nginx will serve the built files directly.
  frontend-build:
    container_name: blackjack-frontend-build
    build: ./frontend
    volumes:
      - frontend-dist:/app/dist
    restart: "no"

  # Node.js API server — handles authentication, game logic and WebSockets.
  # Waits for the database and ML service to be ready before starting.
  backend:
    container_name: blackjack-backend
    build: ./backend
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - ML_SERVICE_URL=http://ml-service:5000
      - NODE_ENV=production
    depends_on:
      - db
      - ml-service
    command: npm start

  # Reverse proxy — the only service exposed to the host.
  # Serves static frontend files and forwards API/WebSocket traffic to the backend.
  # Waits for frontend-build to complete successfully before starting.
  nginx:
    container_name: blackjack-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./requirements/nginx/conf.d/blackjack.conf:/etc/nginx/conf.d/blackjack.conf
      - ./secrets/certs/blackjack.local.crt:/etc/ssl/certs/blackjack.local.crt
      - ./secrets/certs/blackjack.local.key:/etc/ssl/private/blackjack.local.key
      # Mount built frontend files as read-only
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_started
      ml-service:
        condition: service_started

  # Python ML service — provides AI opponent logic for the blackjack game.
  ml-service:
    container_name: blackjack-ml-service
    build: ./ml_service
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "5000:5000"

  # PostgreSQL database — stores users, match history and statistics.
  # Schema is initialized automatically from init.sql on first run.
  db:
    image: postgres:15-alpine
    container_name: blackjack-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_PATH}/postgres:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Prometheus — scrapes and stores metrics from the backend and cAdvisor.
  prometheus:
    image: prom/prometheus
    container_name: blackjack-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend

  # Grafana — visualizes Prometheus metrics through custom dashboards.
  # Accessible only from localhost for security.
  grafana:
    image: grafana/grafana
    container_name: blackjack-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # cAdvisor — collects container-level metrics (CPU, memory, network, disk)
  # and exposes them to Prometheus.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: blackjack-cadvisor
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

volumes:
  # Persistent storage for Grafana dashboards and configuration
  grafana-data:
  # Shared volume between frontend-build and Nginx for static files
  frontend-dist:
