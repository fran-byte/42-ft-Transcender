# CHANGED FILE IN ORDER TO WORK ON PORT 5173 -MSORIANO

version: "3.8"

services:
  backend:
    build: ./backend
    container_name: blackjack-backend
    restart: always
    environment:
      - NODE_ENV=production
      - DOMAIN=https://blackjack.local
      - FRONTEND_URL=https://blackjack.local
    networks:
      - transcender_net
    #THIS LINE IS VERY IMPORTANT FOR FRONTEND TO READ FROM PORT 3000 INTO 5173 -MSORIANO
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: blackjack-frontend
    restart: always
    environment:
      - VITE_API_URL=https://blackjack.local/api
      - VITE_WS_URL=wss://blackjack.local
    networks:
      - transcender_net
    #ADDED PORT 5173 ON FRONT  -MSORIANO
    ports:
    - "5173:5173"

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    depends_on:
      - backend
      - frontend
    ports:
        #CHANGED PORT 80:80/443:443 TO 8080:80/8443:443 DUE TO MAKEFILE ERROR  -MSORIANO
      - "8443:443"
      - "8080:80"
    volumes:
      # Certificados para blackjack.local
      - ./secrets/certs/blackjack.local.crt:/etc/ssl/certs/blackjack.local.crt:ro
      - ./secrets/certs/blackjack.local.key:/etc/ssl/private/blackjack.local.key:ro
      # Configuración del sitio
      - ./requirements/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - transcender_net

  db:
    image: mysql:8.0
    container_name: blackjack-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: blackjack
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - transcender_net

networks:
  transcender_net:
    driver: bridge

volumes:
  mysql_data: