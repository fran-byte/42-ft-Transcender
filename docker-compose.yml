version: '3.8'

services:
  # --- BACKEND ---
  backend:
    image: node:22-alpine
    container_name: blackjack-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_NAME=transcendence
    command: npm run dev
    entrypoint: ["sh", "-c", "npm install && npm run dev"]
    depends_on:
      - db

  # --- FRONTEND ---
  frontend:
    image: node:22-alpine
    container_name: blackjack-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    entrypoint: ["sh", "-c", "npm install && npm run dev -- --host"]

  # --- DATABASE ---
  db:
    image: mysql:8.0
    container_name: blackjack-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: transcendence
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: